[project]
name = "strava-analytics"
version = "0.1.0"
description = "Parse and analyze Strava export data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "tabulate>=0.9",
    "numpy>=1.24",
    "scipy>=1.10",
    "dash>=2.18",
    "dash-bootstrap-components>=1.6",
    "plotly>=5.24",
    "fitparse>=0.6",
    "openai>=1.0",
    "mcp>=1.0",
]

[project.scripts]
strava = "strava_analytics.cli:main"
strava-web = "strava_analytics.web.app:main"
strava-mcp = "strava_analytics.web.mcp_server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
