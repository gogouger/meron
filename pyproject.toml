[project]
name = "strava-analytics"
version = "0.2.0"
description = "Parse and analyze Strava export data"
requires-python = ">=3.10"

# Core runtime dependencies. Pinned to the major series that's been tested
# (>=X,<X+1) so minor/patch updates flow in but a major bump must be
# opted into explicitly. Satisfies the CLAUDE.md "pin your versions"
# standard while matching the versions actually working in the repo.
dependencies = [
    "pandas>=2.0,<4",
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "sqlalchemy>=2.0,<3",
    "stravalib>=2.0,<3",
    "fitparse>=1.2,<2",
    "cryptography>=42.0,<46",
    "python-dotenv>=1.0,<2",
    "flask>=3.0,<4",
    "itsdangerous>=2.1,<3",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# Dash web UI — only needed for the strava-web server.
web = [
    "dash>=2.18,<5",
    "dash-bootstrap-components>=1.6,<3",
    "plotly>=5.24,<7",
    "tabulate>=0.9,<1",
    "qrcode>=7.4,<9",  # QR codes for the mobile pairing card on /settings
]
# REST API extras — CORS + rate limiting for production deployments.
api = [
    "flask-cors>=4.0,<7",
    "flask-limiter>=3.5,<5",
]
# MCP (Model Context Protocol) server for ChatGPT.
mcp = [
    "mcp>=1.0,<2",
]
# OpenAI chat widget.
ai = [
    "openai>=1.0,<3",
]
# Development / CI.
test = [
    "pytest>=8.0,<10",
]

[project.scripts]
strava = "strava_analytics.cli:main"
strava-web = "strava_analytics.web.app:main"
strava-api = "strava_analytics.api.app:main"
strava-mcp = "strava_analytics.web.mcp_server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["strava_analytics*"]
exclude = ["scripts*", "tests*"]
