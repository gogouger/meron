[project]
name = "strava-analytics"
version = "0.2.0"
description = "Parse and analyze Strava export data"
requires-python = ">=3.10"

# Core runtime dependencies. Pinned with compatible-release specifiers
# (~=X.Y) so minor/patch updates flow in but a major bump must be opted
# into explicitly. Satisfies the CLAUDE.md "pin your versions" standard.
dependencies = [
    "pandas~=2.0",
    "numpy~=1.24",
    "scipy~=1.10",
    "sqlalchemy~=2.0",
    "stravalib~=2.0",
    "fitparse~=0.6",
    "cryptography~=42.0",
    "python-dotenv~=1.0",
    "flask~=3.0",
    "itsdangerous~=2.1",
    "pydantic~=2.0",
    "pyyaml~=6.0",
]

[project.optional-dependencies]
# Dash web UI — only needed for the strava-web server.
web = [
    "dash~=2.18",
    "dash-bootstrap-components~=1.6",
    "plotly~=5.24",
    "tabulate~=0.9",
]
# REST API extras — CORS + rate limiting for production deployments.
api = [
    "flask-cors~=4.0",
    "flask-limiter~=3.5",
]
# MCP (Model Context Protocol) server for ChatGPT.
mcp = [
    "mcp~=1.0",
]
# OpenAI chat widget.
ai = [
    "openai~=1.0",
]
# Development / CI.
test = [
    "pytest~=8.0",
]

[project.scripts]
strava = "strava_analytics.cli:main"
strava-web = "strava_analytics.web.app:main"
strava-api = "strava_analytics.api.app:main"
strava-mcp = "strava_analytics.web.mcp_server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["strava_analytics*"]
exclude = ["scripts*", "tests*"]
