openapi: "3.1.0"
info:
  title: MERON API
  description: >
    Personal training data API. Provides fitness metrics, activity CRUD,
    training plans, race predictions, and Strava sync. All distances in
    miles, weights in lbs, elevations in feet. Times in seconds unless
    otherwise noted.
  version: "2.0.0"
servers:
  - url: http://localhost:8051
    description: Local standalone API server (strava-api)
  - url: http://localhost:8050
    description: Local Dash + API combined server (strava-web)

security:
  - ApiKeyAuth: []

tags:
  - name: metrics
    description: Read-only metric endpoints.
  - name: activities
    description: Activity CRUD.
  - name: plan
    description: Training plan, race predictions, strength projections.
  - name: sync
    description: Strava / Apple Health sync triggers.
  - name: user
    description: User profile.
  - name: routes
    description: Route polylines + stream data for map rendering.
  - name: auth
    description: Mobile-app pairing / bootstrap.
  - name: oauth
    description: Strava OAuth flow.
  - name: meta
    description: Health + schema endpoints.

paths:
  /api/healthz:
    get:
      tags: [meta]
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/openapi.yaml:
    get:
      tags: [meta]
      operationId: openapiYaml
      summary: Fetch the OpenAPI spec (YAML)
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 spec as text/yaml
          content:
            text/yaml: {}

  /api/openapi.json:
    get:
      tags: [meta]
      operationId: openapiJson
      summary: Fetch the OpenAPI spec (JSON)
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 spec as JSON
          content:
            application/json: {}

  /api/fitness:
    get:
      tags: [metrics]
      operationId: getFitness
      summary: Current fitness snapshot
      responses:
        "200":
          description: CTL / ATL / TSB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fitness" }

  /api/fitness/timeseries:
    get:
      tags: [metrics]
      operationId: getFitnessTimeseries
      summary: Daily CTL/ATL/TSB timeseries for charting
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 90 }
      responses:
        "200":
          description: Daily points
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FitnessPoint" }

  /api/stats:
    get:
      tags: [metrics]
      operationId: getStats
      summary: Lifetime activity stats
      responses:
        "200":
          description: Lifetime totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }

  /api/activities:
    get:
      tags: [activities]
      operationId: getRecentActivities
      summary: Recent activities
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 14 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecentActivity" }
    post:
      tags: [activities]
      operationId: createActivity
      summary: Create a manual activity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/activities/feed:
    get:
      tags: [activities]
      operationId: getActivityFeed
      summary: Cursor-paginated activity feed for the mobile infinite scroll
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque cursor from a previous response. Omit for page 1.
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityFeedPage" }

  /api/activities/{activity_id}:
    parameters:
      - name: activity_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [activities]
      operationId: getActivity
      summary: Fetch a single enriched activity
      responses:
        "200":
          description: Activity detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [activities]
      operationId: patchActivity
      summary: Update an activity (or add a manual override for Strava rows)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  updated:
                    type: array
                    items: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [activities]
      operationId: deleteActivity
      summary: Soft-delete an activity
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  deleted: { type: boolean }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/mileage:
    get:
      tags: [metrics]
      operationId: getWeeklyMileage
      summary: Weekly running mileage
      parameters:
        - name: weeks
          in: query
          schema: { type: integer, default: 8 }
      responses:
        "200":
          description: Mileage list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WeeklyMileage" }

  /api/records:
    get:
      tags: [metrics]
      operationId: getPersonalRecords
      summary: Personal records across standard distances
      responses:
        "200":
          description: PR list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PersonalRecord" }

  /api/strength:
    get:
      tags: [metrics]
      operationId: getStrength
      summary: Current 1RM estimates
      responses:
        "200":
          description: 1RM per lift
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Strength" }

  /api/strength/progression:
    get:
      tags: [plan]
      operationId: getStrengthProgression
      summary: 1RM fit curves + projections at 4/8/12 weeks
      parameters:
        - name: weeks
          in: query
          description: Comma-separated horizons in weeks
          schema: { type: string, default: "4,8,12" }
      responses:
        "200":
          description: Fit + projections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrengthProjection" }

  /api/runs:
    get:
      tags: [metrics]
      operationId: getDetailedRuns
      summary: Detailed run history
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }

  /api/lifts:
    get:
      tags: [metrics]
      operationId: getDetailedLifts
      summary: Detailed lift session history
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Lift session list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lift" }

  /api/summary:
    get:
      tags: [metrics]
      operationId: getAthleteSummary
      summary: Combined overview (fitness + stats + activities + mileage + PRs)
      responses:
        "200":
          description: Full summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }

  /api/plan:
    get:
      tags: [plan]
      operationId: getTrainingPlan
      summary: Generated training plan (8-week periodized)
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }

  /api/predict/race:
    get:
      tags: [plan]
      operationId: predictRace
      summary: Critical Speed race time predictions
      parameters:
        - name: distance_m
          in: query
          schema: { type: number }
          description: Optional filter for a single distance in metres
      responses:
        "200":
          description: Predictions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RacePrediction" }

  /api/lifting-program:
    get:
      tags: [plan]
      operationId: getLiftingProgram
      summary: Structured lifting program (baseline, end PRs, weekly schedule)
      responses:
        "200":
          description: Program
          content:
            application/json:
              schema:
                type: object
                properties:
                  baseline: { type: object }
                  end_prs: { type: object }
                  program:
                    type: array
                    items: { type: object }

  /api/user:
    get:
      tags: [user]
      operationId: getUserProfile
      summary: Current user profile + Strava connection status
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/route-index:
    get:
      tags: [routes]
      operationId: getRouteIndex
      summary: Every cached route fingerprint, keyed by filename
      responses:
        "200":
          description: Route index
          content:
            application/json:
              schema:
                type: object
                properties:
                  routes:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: array
                        items: { type: number }

  /api/routes/{filename}:
    parameters:
      - name: filename
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [routes]
      operationId: getRouteDetail
      summary: Polyline + streams for a single activity
      responses:
        "200":
          description: Route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteDetail" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with username + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/SessionUser" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Clear the session
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: Current session info (401 when not logged in)
      security: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: Create an account using an invite code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, invite_code]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 8, format: password }
                invite_code: { type: string }
      responses:
        "201":
          description: Created and logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/SessionUser" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/invites:
    get:
      tags: [auth]
      operationId: listInvites
      summary: Admin — list outstanding invite codes
      responses:
        "200":
          description: Invite list
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        created_at: { type: string, format: date-time }
                        expires_at:
                          type: string
                          format: date-time
                          nullable: true
    post:
      tags: [auth]
      operationId: createInvite
      summary: Admin — generate a new invite code
      responses:
        "201":
          description: New code
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/invites/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [auth]
      operationId: revokeInvite
      summary: Admin — delete an unused invite code
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/pair/claim:
    post:
      tags: [auth]
      operationId: claimPairCode
      summary: Mobile app bootstrap — exchange a pair code for an API key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 8-character pair code generated in Settings
      responses:
        "200":
          description: Claimed — stash api_key + api_base on the device
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key: { type: string }
                  api_base: { type: string, format: uri }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sync/strava:
    post:
      tags: [sync]
      operationId: syncStrava
      summary: Trigger an incremental Strava API sync
      responses:
        "200":
          description: Sync report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncReport" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sync/upload:
    post:
      tags: [sync]
      operationId: syncUpload
      summary: Bulk upload a Strava export (.csv or .zip)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Sync report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncReport" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/sync/apple-health:
    post:
      tags: [sync]
      operationId: syncAppleHealth
      summary: (stub) Apple Health ingest — not yet implemented
      responses:
        "501":
          description: Not implemented
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /oauth/strava/start:
    get:
      tags: [oauth]
      operationId: oauthStart
      summary: Begin Strava OAuth — redirects to Strava's authorize URL
      security: []
      responses:
        "302":
          description: Redirect to Strava

  /oauth/strava/callback:
    get:
      tags: [oauth]
      operationId: oauthCallback
      summary: OAuth callback — exchanges code for tokens
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect back to /settings#strava-connected
        "400":
          description: State mismatch or missing code

  /oauth/strava/disconnect:
    post:
      tags: [oauth]
      operationId: oauthDisconnect
      summary: Clear stored Strava tokens
      responses:
        "200":
          description: OK

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Read key for GET; write key for POST/PATCH/DELETE.

  responses:
    BadRequest:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
          required: [code, message]

    Fitness:
      type: object
      properties:
        ctl: { type: number }
        atl: { type: number }
        tsb: { type: number }
        label: { type: string }
        date: { type: string, format: date }

    FitnessPoint:
      type: object
      properties:
        date: { type: string, format: date }
        ctl: { type: number, nullable: true }
        atl: { type: number, nullable: true }
        tsb: { type: number, nullable: true }

    Stats:
      type: object
      properties:
        total_activities: { type: integer }
        total_runs: { type: integer }
        total_lifts: { type: integer }
        total_miles: { type: number }
        date_from: { type: string, nullable: true }
        date_to: { type: string, nullable: true }

    RecentActivity:
      type: object
      properties:
        date: { type: string, format: date }
        type: { type: string }
        name: { type: string }
        distance_mi: { type: number }
        pace: { type: string }
        pace_decimal: { type: number }
        avg_hr: { type: number }
        duration_s: { type: number }
        elevation_ft: { type: number }
        run_type: { type: string }

    FeedItem:
      type: object
      properties:
        _id: { type: integer }
        date: { type: string, format: date }
        type: { type: string }
        name: { type: string }
        distance_mi: { type: number }
        pace: { type: string }
        pace_decimal: { type: number }
        avg_hr: { type: number }
        duration_s: { type: number }
        elevation_ft: { type: number }
        run_type: { type: string }

    ActivityFeedPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FeedItem" }
        next_cursor:
          type: string
          nullable: true
          description: Pass to the next GET /activities/feed; null means end of feed.

    Activity:
      type: object
      description: Full enriched activity record. Fields vary by activity type.
      additionalProperties: true
      properties:
        _id: { type: integer }
        date: { type: string, format: date }
        type: { type: string }
        name: { type: string }
        distance_m: { type: number }
        distance_mi: { type: number }
        moving_time_s: { type: number }
        elapsed_time_s: { type: number }
        avg_hr: { type: number }
        max_hr: { type: number }
        avg_watts: { type: number }
        calories: { type: number }
        elevation_gain_m: { type: number }

    ActivityCreate:
      type: object
      required: [type, start_time]
      properties:
        type: { type: string }
        start_time: { type: string, format: date-time }
        name: { type: string }
        description: { type: string }
        gear: { type: string }
        elapsed_time_s: { type: number, minimum: 0 }
        moving_time_s: { type: number, minimum: 0 }
        distance_m: { type: number, minimum: 0 }
        elevation_gain_m: { type: number }
        max_hr: { type: number }
        avg_hr: { type: number }
        avg_watts: { type: number, minimum: 0 }
        calories: { type: number, minimum: 0 }
        weather_condition: { type: string }
        weather_temp_c: { type: number }

    ActivityPatch:
      type: object
      description: Partial update — every field optional.
      additionalProperties: false
      properties:
        name: { type: string }
        type: { type: string }
        description: { type: string }
        gear: { type: string }
        filename: { type: string }
        start_time: { type: string, format: date-time }
        elapsed_time_s: { type: number }
        moving_time_s: { type: number }
        distance_m: { type: number }
        max_speed_ms: { type: number }
        avg_speed_ms: { type: number }
        elevation_gain_m: { type: number }
        elevation_loss_m: { type: number }
        elevation_low_m: { type: number }
        elevation_high_m: { type: number }
        max_hr: { type: number }
        avg_hr: { type: number }
        avg_watts: { type: number }
        calories: { type: number }
        relative_effort: { type: number }
        grade_adj_distance_m: { type: number }
        total_steps: { type: number }
        training_load: { type: number }
        intensity: { type: number }
        weather_condition: { type: string }
        weather_temp_c: { type: number }
        competition: { type: string }
        strava_with_kid: { type: integer }

    WeeklyMileage:
      type: object
      properties:
        week_of: { type: string, format: date }
        miles: { type: number }

    PersonalRecord:
      type: object
      properties:
        distance: { type: string }
        best_time: { type: string }
        best_pace: { type: string }
        best_date: { type: string, format: date }

    Strength:
      type: object
      properties:
        bench: { type: number }
        squat: { type: number }
        deadlift: { type: number }
        ohp: { type: number }

    Run:
      type: object
      properties:
        date: { type: string, format: date }
        name: { type: string }
        distance_mi: { type: number }
        pace: { type: string }
        pace_decimal: { type: number }
        avg_hr: { type: number }
        max_hr: { type: number }
        elevation_ft: { type: number }
        duration_s: { type: number }
        run_type: { type: string }
        calories: { type: number }

    Lift:
      type: object
      properties:
        date: { type: string, format: date }
        name: { type: string }
        bench_lbs: { type: number }
        squat_lbs: { type: number }
        deadlift_lbs: { type: number }
        ohp_lbs: { type: number }
        duration_s: { type: number }

    Summary:
      type: object
      properties:
        fitness: { $ref: "#/components/schemas/Fitness" }
        stats: { $ref: "#/components/schemas/Stats" }
        recent_activities:
          type: array
          items: { $ref: "#/components/schemas/RecentActivity" }
        weekly_mileage:
          type: array
          items: { $ref: "#/components/schemas/WeeklyMileage" }
        strength: { $ref: "#/components/schemas/Strength" }
        personal_records:
          type: array
          items: { $ref: "#/components/schemas/PersonalRecord" }

    User:
      type: object
      properties:
        id: { type: integer }
        display_name: { type: string, nullable: true }
        timezone: { type: string }
        strava_athlete_id: { type: integer, nullable: true }
        strava_connected: { type: boolean }
        created_at: { type: string, format: date-time, nullable: true }

    SessionUser:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        display_name: { type: string, nullable: true }
        is_admin: { type: boolean }

    Plan:
      type: object
      properties:
        start_date: { type: string, format: date }
        races:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              date: { type: string, format: date }
        workouts:
          type: array
          items:
            type: object
            additionalProperties: true

    RacePrediction:
      type: object
      properties:
        cs:
          type: object
          properties:
            cs_m_per_s: { type: number }
            cs_min_per_mi: { type: number }
            d_prime_m: { type: number }
            r_squared: { type: number }
            n_points: { type: integer }
        predictions:
          type: object
          additionalProperties:
            type: object
            properties:
              time_s: { type: number }
              pace_min_per_mi: { type: number }
              method: { type: string }
              confidence: { type: string }

    StrengthProjection:
      type: object
      properties:
        weekly_running_miles: { type: number }
        interference_factor: { type: number }
        lifts:
          type: object
          additionalProperties:
            type: object
            properties:
              fit: { type: object }
              projections:
                type: array
                items:
                  type: object
                  properties:
                    weeks: { type: integer }
                    projected_1rm: { type: number }

    RouteDetail:
      type: object
      properties:
        filename: { type: string }
        polyline:
          type: array
          items:
            type: array
            items: { type: number }
        streams:
          type: object
          properties:
            timestamps:
              type: array
              items: { type: string }
            heart_rate:
              type: array
              items: { type: number, nullable: true }
            altitude_m:
              type: array
              items: { type: number, nullable: true }
            speed_m_per_s:
              type: array
              items: { type: number, nullable: true }

    SyncReport:
      type: object
      properties:
        inserted: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          items: { type: string }
